# Self-hosted Convex backend + dashboard for wepaintai.
# Based on the official compose file from github.com/get-convex/convex-backend.
# Images are published under ghcr.io/convex/* (the old ghcr.io/get-convex/*
# paths now return 403) and are pinned by digest; override with
# CONVEX_BACKEND_IMAGE / CONVEX_DASHBOARD_IMAGE in selfhost/.env to upgrade.
#
# Usage (from the selfhost/ directory):
#   cp .env.example .env   # fill in values
#   docker compose up -d
#   docker compose exec backend ./generate_admin_key.sh
services:
  backend:
    image: ${CONVEX_BACKEND_IMAGE:-ghcr.io/convex/convex-backend@sha256:d4e012c68640830310139632481f8d1c1915bdf66de5c3a594a99799eab51679}
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${CONVEX_BIND_HOST:-127.0.0.1}:3210:3210" # deployment API + WebSocket sync (VITE_CONVEX_URL points here)
      - "${CONVEX_BIND_HOST:-127.0.0.1}:3211:3211" # HTTP actions (Polar webhooks point here)
    volumes:
      - data:/convex/data
    environment:
      - INSTANCE_NAME=${INSTANCE_NAME:-wepaintai}
      - INSTANCE_SECRET
      # Public URLs the backend advertises to clients. Must match the
      # Cloudflare Tunnel hostnames once the tunnel is up.
      - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:3210}
      - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN:-http://127.0.0.1:3211}
      - DO_NOT_REQUIRE_SSL=${DO_NOT_REQUIRE_SSL:-true} # TLS terminates at Cloudflare
      - DISABLE_BEACON=${DISABLE_BEACON:-false}
      - DOCUMENT_RETENTION_DELAY=${DOCUMENT_RETENTION_DELAY:-172800}
      - RUST_LOG=${RUST_LOG:-info}
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s
    restart: unless-stopped

  dashboard:
    image: ${CONVEX_DASHBOARD_IMAGE:-ghcr.io/convex/convex-dashboard@sha256:2cb0f7e51597ea41d08147649f9f65cb2676aa96ce1f2fce1531116a408e1c98}
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      # Loopback-only by default; never route it through the tunnel. Reach it
      # remotely with an SSH tunnel (see selfhost/README.md). Override
      # CONVEX_BIND_HOST only if LAN access is explicitly needed.
      - "${CONVEX_BIND_HOST:-127.0.0.1}:6791:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=${NEXT_PUBLIC_DEPLOYMENT_URL:-http://127.0.0.1:3210}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
