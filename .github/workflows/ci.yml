name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Run tests
        run: corepack pnpm test:run

      - name: Lint
        run: corepack pnpm exec eslint . --quiet

      - name: Validate preview shell scripts
        run: |
          bash -n selfhost/preview/*.sh
          shellcheck -x -P SCRIPTDIR selfhost/preview/*.sh

      - name: Production build
        env:
          VITE_CONVEX_URL: https://example.convex.cloud
          VITE_CONVEX_SITE_URL: https://example.convex.site
        run: corepack pnpm build
